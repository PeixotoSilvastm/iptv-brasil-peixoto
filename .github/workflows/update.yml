name: Atualizar playlist

on:
  schedule:
    - cron: "17 */6 * * *"   # a cada 6 horas
  workflow_dispatch:          # permite rodar manualmente

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar playlist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          #!/usr/bin/env python3
          """
          Gera playlist.m3u8 (TV ao vivo do Brasil) a partir de Arshad-Kamal/Nuvio-KE-channels.

          Fontes:
            pool/streams.tsv    -> catálogo de streams (nome, url, país, categoria, headers...)
            monitor/state.tsv   -> estado de cada URL medido 2x/dia (alive/suspect/down/blocked/gone)
            epg-br (vinnyoliveira) -> guia XMLTV; usado para preencher o tvg-id de cada canal

          Regras principais:
            - só entra URL com estado "alive" (e "suspect" apenas se já estava na playlist anterior,
              para um tropeço isolado não derrubar o canal)
            - URLs de IP solto (restreams) só entram se estiverem estáveis (vivas em vários horários)
            - sem duplicatas: no máximo MAX_PER_CHANNEL URLs por canal (a melhor + 1 reserva)
            - se algo falhar (download ou lista pequena demais), a playlist anterior é mantida
            - tvg-id: usa o id da fonte se ele existir no guia; senão casa pelo nome (ou por ALIASES);
              se o guia não puder ser baixado, a playlist sai igual à de antes (só com o id da fonte)
          """
          import csv
          import datetime as dt
          import io
          import json
          import os
          import re
          import sys
          import unicodedata
          import urllib.request

          BASE = "https://raw.githubusercontent.com/Arshad-Kamal/Nuvio-KE-channels/main"
          OUT = os.environ.get("OUT_FILE", "playlist.m3u8")

          # Guia (XMLTV). Use o MESMO link no Nuvio, em "Listas e guias por URL".
          EPG_URL = os.environ.get("EPG_URL", "https://vinnyoliveira.github.io/epg-br/epg-rich.xml")

          MAX_PER_CHANNEL = 2        # melhor URL + 1 reserva
          MIN_CHANNELS = 60          # abaixo disso, considera falha e não sobrescreve
          STALE_DAYS = 3             # monitor do Arshad sem commit há mais que isso -> alerta (falha o workflow)
          MIN_SLOTS_IP_HOST = 4      # IP solto: precisa ter funcionado em >=4 dos 8 horários do monitor
          KEEP_GROUPS = ["Esportes", "Notícias", "Filmes", "Abertas"]  # ordem na lista

          csv.field_size_limit(10**8)

          # ----------------------------------------------------------------- classificação
          def norm(s):
              s = unicodedata.normalize("NFKD", s.lower())
              s = "".join(ch for ch in s if not unicodedata.combining(ch))
              s = re.sub(r"\(.*?\)|\[.*?\]", " ", s)
              s = re.sub(r"\b(fhd|hd|sd|4k|1080p|720p|480p|h265|hevc|link \d)\b", " ", s)
              s = re.sub(r"[^a-z0-9áàâãéêíóôõúç ]", " ", s)
              return re.sub(r"\s+", "", s)


          SPORTS = re.compile(r"sportv|\bespn\b|caz[eé]tv|caze tv|band ?sports|combate|\btnt sports\b|fox sports|"
                              r"\bnsports\b|\bracer\b|\bnfl\b|red bull|sportynet|mavtv|\bufc\b", re.I)
          SPORTS_GLOBAL_ONLY_BR = re.compile(r"\bespn\b|fox sports|tnt sports", re.I)
          NEWS = re.compile(r"globonews|globo news|cnn brasil|jovem pan news|band ?news|record news|"
                            r"sbt news|times brasil|veja\+|bm&c|^tv c[aâ]mara$|^tv senado$|^tv justi[cç]a$|^canal gov$", re.I)
          MOVIES = re.compile(r"telecine|\bhbo\b|sony movies|studio universal|\baxn\b|\btcm\b|cinemax|"
                              r"moviesphere|mytime movie|cine sony|megapix|canal brasil|\bamc\b|"
                              r"sony channel|cine premiere|cindie|\btnt\b", re.I)
          OPEN = re.compile(r"^(tv )?globo( sp| rio)?$|^globo (sp|rio)|^sbt( nacional| sp| rio)?$|"
                            r"^record( ?tv)?( sp| rio)?$|^band(eirantes)?$|^rede ?tv!?( mais)?$|"
                            r"^tv brasil$|^tv cultura$|^tv gazeta$|tv liberal|tv tapaj|tv marajoara|"
                            r"rbatv|tv a cr[ií]tica", re.I)

          # Fora de escopo: regionais que você disse que não quer, canais estrangeiros homônimos etc.
          EXCLUDE = re.compile(r"interior|bras[ií]lia|mutum|oeste|sinop|angola|vila real|amplitude|juina|"
                               r"paran[aá]|goi[aá]s|fernsehen|bayerisch|\bbr alpha\b|bandung|bandamax|stara|"
                               r"spacetoon|space toon|space live|space & beyond|star trek|khushboo|sony one|"
                               r"latin america(?! brazil)|andes|poland|polska|cee\b|czech|asia|taiwan|adria|"
                               r"hungary|romania|bulgaria|central europe|mexico|argentin|chile|colombia|"
                               r"jo[aã]o pessoa|mogi|\blins\b|rs premiere|\barg\b|premium hd|espn ?5|\bsbtv\b|sbt tv|\[paid\]|nova mutum|galega|rio preto|colatina|sao mateus|"
                               r"s[aã]o mateus|maceió|maceio|nbn|natal|plan\b|max rio|tv max", re.I)

          NON_BR_COUNTRY = re.compile(r"^(US|AR|CL|CO|MX|DE|PL|CZ|HU|RO|BG|SG|IN|FR|GB|ES|IT|PT|PY|VE|TH|HR|AT|CH|CA|RU|TR|ID)$")


          def is_brazil(r):
              c = r["country"].strip().upper()
              name = r["name"]
              if r["channel"].endswith(".br") or c == "BR":
                  return True
              if re.search(r"bras[il]l?|brazil|brasil", name, re.I):
                  return True
              if c in ("", "-") and (NEWS.search(name) or OPEN.search(name)
                                     or (SPORTS.search(name) and not SPORTS_GLOBAL_ONLY_BR.search(name))):
                  return True
              return False


          def classify(name):
              n = name.strip()
              if NEWS.search(n):
                  return "Notícias"
              if SPORTS.search(n):
                  return "Esportes"
              if OPEN.search(n):
                  return "Abertas"
              if MOVIES.search(n):
                  return "Filmes"
              return None


          # ----------------------------------------------------------------- qualidade da fonte
          IP_HOST = re.compile(r"^https?://\d{1,3}(\.\d{1,3}){3}(:\d+)?(/|$)")
          GOOD_HOSTS = ("ebc.com.br", "cloudfront.net", "amagi", "jmvstream", "wurl", "uol.com.br",
                        "camara.gov", "senado", "otteravision", "akamaized", "jmp2.uk", "roku.com",
                        "dai.google.com", "tubi.io", "frequency.stream")


          def source_rank(url):
              """menor = melhor"""
              if any(h in url for h in GOOD_HOSTS):
                  return 0
              if IP_HOST.match(url):
                  return 2
              return 1


          def fetch(path):
              req = urllib.request.Request(f"{BASE}/{path}", headers={"User-Agent": "iptv-br-updater"})
              with urllib.request.urlopen(req, timeout=120) as resp:
                  return resp.read().decode("utf-8", "replace")


          def monitor_age_days():
              """Idade (em dias) do último commit em monitor/ no repositório do Arshad. None se não deu pra checar."""
              url = ("https://api.github.com/repos/Arshad-Kamal/Nuvio-KE-channels/commits"
                     "?path=monitor&per_page=1")
              headers = {"User-Agent": "iptv-br-updater", "Accept": "application/vnd.github+json"}
              token = os.environ.get("GITHUB_TOKEN")
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=60) as resp:
                      data = json.load(resp)
                  when = data[0]["commit"]["committer"]["date"]  # ex.: 2026-11-15T12:00:00Z
                  last = dt.datetime.fromisoformat(when.replace("Z", "+00:00"))
                  return (dt.datetime.now(dt.timezone.utc) - last).total_seconds() / 86400
              except Exception as e:  # noqa: BLE001
                  print(f"::warning::Não consegui checar a idade do monitor ({e}); seguindo sem o alerta.")
                  return None


          def previous_urls():
              if not os.path.exists(OUT):
                  return set()
              return {l.strip() for l in open(OUT, encoding="utf-8") if l.startswith("http")}


          # ----------------------------------------------------------------- guia (EPG) / tvg-id
          def epg_norm(s):
              """Como norm(), mas o "+" vira "plus" (assim "SportyNet" e "SportyNet +" não colidem)."""
              return norm(s.replace("+", " plus "))


          # Nomes da playlist que o guia chama de outra coisa -> id do guia
          ALIASES = {
              "tvliberal": "GloboTvLiberalBelem.br",
              "tvliberalbelem": "GloboTvLiberalBelem.br",
              "tvcultura": "TVCultura.br",
              "tvglobosp": "TVGloboSaoPaulo.br",
              "tvgloborio": "TVGloboRiodeJaneiro.br",
              "globorio": "TVGloboRiodeJaneiro.br",
              "recordsp": "RecordTVPaulista.br",
              "recordtvsp": "RecordTVPaulista.br",
              "bandsp": "BandPaulista.br",
              # nomes que vêm com sufixo/prefixo da fonte (chave = nome sem acentos/símbolos/espaços)
              "bandeirantes": "Band.br",
              "recordtv": "Record.br",
              "sbtnacional": "SBTNacional.br",
              "amclatinamericabrazil": "Amc.br",
              "tntlatinamericabrazil": "Tnt.br",
              "studiouniversallatinamericabrazil": "StudioUniversal.br",
              "tcm10": "Tcm.br",
              "moviespherebrasil": "Moviesphere.br",
              "mytimemovienetworkbrazil": "MyTimeMovieNetwork.br",
              "timesbrasilcnbc": "TimesBrasil.br",
              "vejaplustv": "VEJAPlusTV.br",
              "440nflchannel": "NflChannel.br",
              "484redbulltv": "RedBullTv.br",
              "redbulltvaustria": "RedBullTv.br",
          }


          def load_epg_ids():
              """Lê o XMLTV e devolve (conjunto de ids, nome normalizado -> id). Vazio se falhar."""
              import xml.etree.ElementTree as ET
              ids, by_name = set(), {}
              try:
                  req = urllib.request.Request(EPG_URL, headers={"User-Agent": "iptv-br-updater"})
                  with urllib.request.urlopen(req, timeout=300) as resp:
                      for _, el in ET.iterparse(resp, events=("end",)):
                          if el.tag == "channel":
                              cid = el.get("id")
                              if cid:
                                  ids.add(cid)
                                  for dn in el.findall("display-name"):
                                      if dn.text:
                                          by_name.setdefault(epg_norm(dn.text), cid)
                              el.clear()
                          elif el.tag == "programme":
                              el.clear()
              except Exception as e:  # noqa: BLE001
                  print(f"::warning::Não consegui ler o EPG ({e}); usando só o id da fonte.")
                  return set(), {}
              for k, v in ALIASES.items():
                  if v in ids:
                      by_name[k] = v
              print(f"EPG: {len(ids)} canais carregados.")
              return ids, by_name


          def main():
              age = monitor_age_days()
              if age is not None and age > STALE_DAYS:
                  print(f"::error::O monitor do Nuvio-KE-channels está parado há {age:.1f} dias "
                        f"(limite {STALE_DAYS}). Estado dos canais pode estar velho; playlist NÃO atualizada.",
                        file=sys.stderr)
                  return 2
              if age is not None:
                  print(f"Monitor do Arshad atualizado há {age:.1f} dias.")
              try:
                  pool_txt = fetch("pool/streams.tsv")
                  state_txt = fetch("monitor/state.tsv")
              except Exception as e:  # noqa: BLE001
                  print(f"Falha ao baixar fontes ({e}); playlist anterior mantida.", file=sys.stderr)
                  return 1

              state = {r["url"]: r for r in csv.DictReader(io.StringIO(state_txt), delimiter="\t")}
              pool = csv.DictReader(io.StringIO(pool_txt), delimiter="\t", quoting=csv.QUOTE_NONE)
              prev = previous_urls()

              cands = {}  # chave do canal -> lista de (rank, url, nome, grupo, tvg_id)
              for r in pool:
                  url = r["url"]
                  st = state.get(url)
                  if not st:
                      continue
                  s = st["state"]
                  if s == "suspect" and url in prev:
                      pass  # tolerância a falha isolada
                  elif s != "alive":
                      continue
                  if r["headers"] not in ("-", ""):
                      continue  # precisa de Referer/User-Agent: o player pode não repassar
                  if "|" in url or ";" in url:
                      continue
                  if not is_brazil(r):
                      continue
                  name = r["name"].strip()
                  if EXCLUDE.search(name):
                      continue
                  group = classify(name)
                  if group not in KEEP_GROUPS:
                      continue
                  # IP solto só se estável ao longo do dia
                  if IP_HOST.match(url) and st.get("slots", "").count("1") < MIN_SLOTS_IP_HOST:
                      continue
                  key = (group, norm(name))
                  cands.setdefault(key, []).append((source_rank(url), url, name, r["channel"]))

              entries = []
              for (group, _), items in cands.items():
                  items.sort(key=lambda x: (x[0], x[1] not in prev))  # prefere fonte boa; empate -> já usada
                  seen = set()
                  for rank, url, name, chan in items:
                      if url in seen:
                          continue
                      seen.add(url)
                      if len(seen) > MAX_PER_CHANNEL:
                          break
                      entries.append((KEEP_GROUPS.index(group), name.lower(), group, name, url, chan))

              entries.sort()
              if len(entries) < MIN_CHANNELS:
                  print(f"Só {len(entries)} canais (mínimo {MIN_CHANNELS}); playlist anterior mantida.",
                        file=sys.stderr)
                  return 1

              epg_ids, epg_by_name = load_epg_ids()
              header = f'#EXTM3U url-tvg="{EPG_URL}"' if epg_ids else "#EXTM3U"
              lines = [header]
              missing = []
              for _, _, group, name, url, chan in entries:
                  if epg_ids:
                      tid = chan if chan in epg_ids else epg_by_name.get(epg_norm(name), "")
                  else:
                      tid = chan if chan and chan != "-" else ""
                  if epg_ids and not tid:
                      missing.append(name)
                  tvg = f' tvg-id="{tid}"' if tid else ""
                  lines.append(f'#EXTINF:-1{tvg} tvg-name="{name}" group-title="{group}",{name}')
                  lines.append(url)
              if missing:
                  print(f"Sem tvg-id ({len(missing)}): {', '.join(sorted(set(missing)))}")
              new = "\n".join(lines) + "\n"

              if os.path.exists(OUT) and open(OUT, encoding="utf-8").read() == new:
                  print("Sem mudanças.")
                  return 0
              with open(OUT, "w", encoding="utf-8") as f:
                  f.write(new)
              by = {}
              for e in entries:
                  by[e[2]] = by.get(e[2], 0) + 1
              print(f"{len(entries)} entradas escritas em {OUT}: {by}")
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PYEOF

      - name: Commit se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u8
          git diff --cached --quiet || git commit -m "Atualiza playlist"
          git push
