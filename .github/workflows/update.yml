name: Atualizar Playlist IPTV Brasil

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualiza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixa a playlist do Brasil
        run: curl -fsSL https://iptv-org.github.io/iptv/countries/br.m3u -o br.m3u

      - name: Filtra, remove duplicados e monta a playlist
        run: |
          python3 - <<'PY'
          import re, unicodedata
          from collections import Counter

          # ===== AJUSTES (mude aqui) =====
          TIRAR_NOT_247   = True    # remove canais marcados [Not 24/7]
          TIRAR_GEOBLOCK  = False   # remove canais marcados [Geo-blocked]
          RESOLUCAO_MIN   = 360     # remove resolução menor. 0 = não filtra
          BLOQUEAR        = ["tvmatic crafts", "tvmatic facebook", "tvmatic funny", "tvmatic tiktok",
                             "petlovers", "tv+pet", "1001 noites", "tiktok radio", "gospel cartoon"]

          # Links que você testou e NÃO abriram. Bloqueia só O LINK, não o canal: se o iptv-org
          # trocar por um link novo do mesmo canal, ele volta sozinho na próxima atualização.
          NAO_ABRE_URL = [
              "http://45.177.114.115/TV_BRASIL_2/index.m3u8",   # Canal Gov (720p)
              "http://45.177.114.114/HISTORY/index.m3u8",   # History (Brazil) (720p)
              "https://video09.logicahost.com.br/tvparaense/tvparaense/playlist.m3u",   # TV Paraense (720p)
              "http://143.14.134.107/167/index.m3u8",   # Combate (720p)
              "http://190.83.2.182:8090/ESPN3/index.m3u8",   # ESPN 3 (Brazil) (1080p)
              "https://ogc-nsprt-tcl-roku-syndication.otteravision.com/ogc/nsprt/nsprt.m3u8",   # N Sports (1080p)
              "http://195.178.110.110/sportv2/index.m3u8",   # SporTV 2 (1080p)
              "http://195.178.110.110/sportv3/index.m3u8",   # SporTV 3 (1080p)
              "http://cdn.tvmatic.net/fight.m3u8",   # TVMatic Fight (720p)
              "https://cdn-5.nxplay.com.br/BAND_NEWS/index.m3u8",   # BandNews (1080p)
              "https://cdn.live.br1.jmvstream.com/w/LVW-11668/ngrp:LVW11668_wiJpjbMrks_all/playlist.m3u8",   # BR8 TV
              "http://170.82.202.31/GNT/index.m3u8",   # GNT (1080p)
              "http://45.177.114.115/RECORD_NEWS/index.m3u8",   # Record News (720p)
          ]

          # Cabeçalhos extras para canais que davam erro 403 (tentativa: simula um navegador).
          HEADERS = {"band sports": "https://www.band.uol.com.br/"}
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

          # Nos grupos abaixo (onde ficam os canais abertos/locais), só entra:
          #  - rede nacional (lista NACIONAIS) ou
          #  - canal local permitido (lista LOCAIS_OK)
          GRUPOS_RESTRITOS = ["TV Aberta", "Outros", "Entretenimento"]
          NACIONAIS = ["rede globo", "globoplay", "band (", "record (", "sbt nacional", "redetv",
                       "rede tv", "rede brasil", "tv brasil (", "canal uol", "amazon sat", "tv senado",
                       "tv justica", "canal gov", "boas novas", "rede familia", "cancao nova",
                       "sesc tv", "sony", "comedy central", "canal do boi", "tv ra tim bum", "canal libras"]
          LOCAIS_OK = ["liberal", "tapajos",                               # Pará
                       "recordtv rio", "rede cnt rio de janeiro",          # Rio (capital)
                       "tv globo sao paulo", "recordtv sao paulo",         # São Paulo (capital)
                       "tv cultura", "tv gazeta"]

          # Canais manuais (não existem no iptv-org). Cole o link .m3u8 entre as aspas.
          # Os que ficarem com link vazio ("") são ignorados.
          EXTRAS = [("TV Liberal (Belem)", "", "TV Aberta"),
                    ("TV Tapajos (Santarem)", "", "TV Aberta"),
                    ("BandNews (manual)", "https://45.162.64.114/BAND_NEWS/index.m3u8", "Noticias")]

          # Locais de outros estados (valem para qualquer grupo): o canal sai se o nome tiver a palavra
          LOCAIS_FORA = ["cuiaba", "mutum", "rondonopolis", "pantanal", "goias", "ufg", "brasilia",
                         "bahia", "salvador", "itapoan", "metropole", "ceara", "piaui", "padre cicero",
                         "meio norte", "arapuan", "natal", "litoral rn", "maceio", "tvcom", "macapa",
                         "curitiba", "parana", "brusque", "catarinense", "unisul", "porto alegre",
                         "passo fundo", "vicosa", "ufop", "sul de minas", "rede minas",
                         "cachoeiro", "sao mateus", "guarapari", "a critica", "encontro das aguas",
                         "santa cecilia", "aratu"]
          LOCAIS_FORA_PALAVRA = ["rs"]   # só como palavra inteira

          ORDEM = ["Noticias", "Esportes", "TV Aberta", "Filmes", "Series", "Infantil",
                   "Documentarios", "Entretenimento", "Musica", "Cultura", "Educacao",
                   "Camaras", "Religiosos"]
          PRIORIDADE = ["News", "Sports", "Movies", "Series", "Kids", "Documentary", "General",
                        "Entertainment", "Music", "Culture", "Education", "Legislative", "Religious"]
          NOMES = {"News": "Noticias", "Sports": "Esportes", "General": "TV Aberta",
                   "Entertainment": "Entretenimento", "Movies": "Filmes", "Series": "Series",
                   "Kids": "Infantil", "Religious": "Religiosos", "Education": "Educacao",
                   "Music": "Musica", "Documentary": "Documentarios", "Legislative": "Camaras",
                   "Culture": "Cultura", "Animation": "Infantil", "Comedy": "Entretenimento",
                   "Public": "TV Aberta", "Business": "Noticias", "Classic": "Entretenimento",
                   "Undefined": "Outros"}
          # ================================

          def sem_acento(t):
              return unicodedata.normalize("NFKD", t).encode("ascii", "ignore").decode().lower()

          def parse(texto):
              linhas, itens, i = texto.splitlines(), [], 0
              while i < len(linhas):
                  if linhas[i].startswith("#EXTINF"):
                      extinf, opts, j = linhas[i], [], i + 1
                      while j < len(linhas) and linhas[j].startswith("#") and not linhas[j].startswith("#EXTINF"):
                          opts.append(linhas[j]); j += 1
                      if j < len(linhas) and linhas[j].strip() and not linhas[j].startswith("#"):
                          itens.append((extinf, opts, linhas[j].strip())); j += 1
                      i = j
                  else:
                      i += 1
              return itens

          def nome_canal(extinf):
              return extinf.rsplit(",", 1)[-1]

          def eh_br(extinf):
              m = re.search(r'tvg-id="[^"]*\.([a-z]{2,3})(?:@[^"]*)?"', extinf)
              return bool(m) and m.group(1) == "br"

          def passa(extinf):
              n = nome_canal(extinf); nn = sem_acento(n)
              if any(k in nn for k in LOCAIS_OK): return True
              if any(k in nn for k in LOCAIS_FORA): return False
              if any(re.search(r"\b%s\b" % w, nn) for w in LOCAIS_FORA_PALAVRA): return False
              if TIRAR_NOT_247 and "[Not 24/7]" in n: return False
              if TIRAR_GEOBLOCK and "[Geo-blocked]" in n: return False
              if RESOLUCAO_MIN:
                  r = re.search(r'\((\d{3,4})[pi]\)', n)
                  if r and int(r.group(1)) < RESOLUCAO_MIN: return False
              if any(b.lower() in nn for b in BLOQUEAR): return False
              return True

          def escolhe_grupo(extinf):
              m = re.search(r'group-title="([^"]*)"', extinf)
              grupos = m.group(1).split(";") if m else ["Undefined"]
              for p in PRIORIDADE:
                  if p in grupos: return NOMES.get(p, p)
              return NOMES.get(grupos[0], grupos[0])

          def aplica_grupo(extinf, g):
              if 'group-title="' in extinf:
                  return re.sub(r'group-title="[^"]*"', 'group-title="%s"' % g, extinf)
              return extinf.replace("#EXTINF:-1", '#EXTINF:-1 group-title="%s"' % g, 1)

          itens = parse(open("br.m3u", encoding="utf-8", errors="replace").read())
          vistos, final = set(), []
          for extinf, opts, url in itens:
              if not (eh_br(extinf) and passa(extinf)) or url in vistos or url in NAO_ABRE_URL:
                  continue
              nn = sem_acento(nome_canal(extinf))
              g = escolhe_grupo(extinf)
              nacional = any(k in nn for k in NACIONAIS)
              ok_local = any(k in nn for k in LOCAIS_OK)
              if g in GRUPOS_RESTRITOS:
                  if nacional or ok_local:
                      g = "TV Aberta"
                  else:
                      continue      # canal aberto/local que não é rede nacional nem local permitido
              vistos.add(url)
              for k, ref in HEADERS.items():
                  if k in nn and not any("http-user-agent" in o for o in opts):
                      opts = opts + ["#EXTVLCOPT:http-user-agent=" + UA, "#EXTVLCOPT:http-referrer=" + ref]
                      extinf = extinf.replace('group-title=', 'http-user-agent="%s" http-referrer="%s" group-title=' % (UA, ref), 1)
              final.append((g, aplica_grupo(extinf, g), opts, url))

          extras = 0
          for nome, url, grupo in EXTRAS:
              if url.strip() and url.strip() not in vistos:
                  vistos.add(url.strip()); extras += 1
                  ext = '#EXTINF:-1 group-title="%s",%s' % (grupo, nome)
                  final.append((grupo, ext, [], url.strip()))

          def chave(it):
              g = it[0]
              pos = ORDEM.index(g) if g in ORDEM else len(ORDEM)
              return (pos, g.lower(), sem_acento(nome_canal(it[1])))
          final.sort(key=chave)

          saida = ["#EXTM3U", "# Lista IPTV Brasil - PeixotoSilvastm"]
          for g, extinf, opts, url in final:
              saida += [extinf] + opts + [url]
          texto = "\n".join(saida) + "\n"
          for nome in ("playlist-final.m3u8", "brasil.m3u"):
              open(nome, "w", encoding="utf-8").write(texto)

          print(len(final), "canais (extras manuais:", extras, ")")
          for g, n in Counter(x[0] for x in final).most_common():
              print("  ", g, n)
          PY

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist-final.m3u8 brasil.m3u
          git diff --staged --quiet || git commit -m "chore: atualiza playlist"
          git push
