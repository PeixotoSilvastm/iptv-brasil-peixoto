name: Atualizar Playlist IPTV Brasil

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualiza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixa a playlist do Brasil
        run: curl -fsSL https://iptv-org.github.io/iptv/countries/br.m3u -o br.m3u

      - name: Filtra, remove duplicados e monta a playlist
        run: |
          python3 - <<'PY'
          import re

          GRUPOS = {"News": "Noticias", "Sports": "Esportes", "General": "Variedades",
                    "Entertainment": "Entretenimento", "Movies": "Filmes", "Series": "Series",
                    "Kids": "Infantil", "Religious": "Religiosos", "Education": "Educacao",
                    "Music": "Musica", "Documentary": "Documentarios", "Legislative": "Camaras",
                    "Culture": "Cultura", "Animation": "Animacao", "Comedy": "Comedia",
                    "Public": "Publicos", "Business": "Negocios", "Classic": "Classicos",
                    "Undefined": "Outros"}

          linhas = open("br.m3u", encoding="utf-8", errors="replace").read().splitlines()
          itens, i = [], 0
          while i < len(linhas):
              if linhas[i].startswith("#EXTINF"):
                  extinf, opts, j = linhas[i], [], i + 1
                  while j < len(linhas) and linhas[j].startswith("#") and not linhas[j].startswith("#EXTINF"):
                      opts.append(linhas[j]); j += 1
                  if j < len(linhas) and linhas[j].strip() and not linhas[j].startswith("#"):
                      itens.append((extinf, opts, linhas[j].strip())); j += 1
                  i = j
              else:
                  i += 1

          def eh_br(extinf):
              m = re.search(r'tvg-id="[^"]*\.([a-z]{2,3})(?:@[^"]*)?"', extinf)
              return bool(m) and m.group(1) == "br"

          def grupo_pt(extinf):
              return re.sub(r'group-title="([^"]*)"',
                            lambda m: 'group-title="%s"' % GRUPOS.get(m.group(1).split(";")[0], m.group(1).split(";")[0]),
                            extinf)

          vistos, final = set(), []
          for extinf, opts, url in itens:
              if eh_br(extinf) and url not in vistos:
                  vistos.add(url)
                  final.append((grupo_pt(extinf), opts, url))

          def chave(it):
              g = re.search(r'group-title="([^"]*)"', it[0])
              return ((g.group(1) if g else "").lower(), it[0].rsplit(",", 1)[-1].lower())
          final.sort(key=chave)

          saida = ["#EXTM3U", "# Lista IPTV Brasil - PeixotoSilvastm"]
          for extinf, opts, url in final:
              saida += [extinf] + opts + [url]
          texto = "\n".join(saida) + "\n"
          for nome in ("playlist-final.m3u8", "brasil.m3u"):
              open(nome, "w", encoding="utf-8").write(texto)
          print(len(final), "canais")
          PY

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist-final.m3u8 brasil.m3u
          git diff --staged --quiet || git commit -m "chore: atualiza playlist"
          git push
