name: Atualizar Playlist IPTV Brasil

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualiza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixa playlists iptv-org
        run: |
          curl -sL https://iptv-org.github.io/iptv/countries/br.m3u     -o br.m3u
          curl -sL https://iptv-org.github.io/iptv/categories/news.m3u   -o news.m3u
          curl -sL https://iptv-org.github.io/iptv/categories/sports.m3u -o sports.m3u
          echo "Baixados:"
          wc -l br.m3u news.m3u sports.m3u

      - name: Monta playlist final
        run: |
          {
            echo "#EXTM3U"
            echo "# Lista IPTV Brasil - PeixotoSilvastm"
            echo ""
            echo "# ===== NOTICIAS ====="
            tail -n +2 news.m3u
            echo ""
            echo "# ===== ESPORTES ====="
            tail -n +2 sports.m3u
            echo ""
            echo "# ===== TV ABERTA / DEMAIS (BRASIL) ====="
            tail -n +2 br.m3u
          } > playlist-final.m3u8
          wc -l playlist-final.m3u8

      - name: Commit e push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist-final.m3u8
          git diff --staged --quiet || git commit -m "chore: atualiza playlist"
          git push
