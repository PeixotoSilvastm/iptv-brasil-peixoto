name: Atualizar Playlist IPTV Brasil

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualiza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixa playlists
        run: |
          curl -sL https://iptv-org.github.io/iptv/categories/news.m3u   -o news.m3u
          curl -sL https://iptv-org.github.io/iptv/categories/sports.m3u -o sports.m3u
          curl -sL https://iptv-org.github.io/iptv/countries/br.m3u      -o br.m3u

      - name: Filtra so canais brasileiros e monta playlist
        run: |
          # Filtra so linhas que tem tvg-country="BR"
          python3 -c "
          with open('news.m3u') as f:
              news = f.readlines()
          with open('sports.m3u') as f:
              sports = f.readlines()
          with open('br.m3u') as f:
              br = f.readlines()

          def filtrar(lines):
              out = []
              i = 0
              while i < len(lines):
                  if lines[i].startswith('#EXTINF'):
                      has_br = 'tvg-country=\"BR\"' in lines[i]
                      out.append(lines[i])
                      if i+1 < len(lines) and not lines[i+1].startswith('#'):
                          if has_br:
                              out.append(lines[i+1])
                          elif '.br' in lines[i+1]:
                              out.append(lines[i+1])
                      i += 2
                  else:
                      i += 1
              return out

          with open('playlist-final.m3u8', 'w') as f:
              f.write('#EXTM3U\n# Lista IPTV Brasil - PeixotoSilvastm\n\n')
              f.write('# ===== NOTICIAS =====\n')
              for l in filtrar(news): f.write(l)
              f.write('\n# ===== ESPORTES =====\n')
              for l in filtrar(sports): f.write(l)
              f.write('\n# ===== TV ABERTA =====\n')
              for l in filtrar(br): f.write(l)
          "
          wc -l playlist-final.m3u8

      - name: Commit e push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist-final.m3u8
          git diff --staged --quiet || git commit -m "chore: atualiza playlist"
          git push
