name: Atualizar Playlist IPTV Brasil

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualiza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixa playlists
        run: |
          curl -sL https://iptv-org.github.io/iptv/countries/br.m3u -o br.m3u
          curl -sL https://iptv-org.github.io/iptv/categories/news.m3u -o news.m3u
          curl -sL https://iptv-org.github.io/iptv/categories/sports.m3u -o sports.m3u

      - name: Filtra e monta playlist
        run: |
          # Filtra so canais que tem tvg-country="BR" na linha da URL
          python3 -c "
          import re

          def filter_br(filename):
              with open(filename) as f:
                  lines = f.readlines()
              result = []
              i = 0
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('#EXTINF'):
                      result.append(line)
                      if i+1 < len(lines) and lines[i+1].startswith('#'):
                          result.append(lines[i+1])
                          i += 2
                      elif i+1 < len(lines) and 'tvg-country=\"BR\"' in lines[i]:
                          result.append(lines[i+1] if i+1 < len(lines) else '')
                          i += 2
                      else:
                          # tenta proxima linha como URL
                          if i+1 < len(lines):
                              result.append(lines[i+1])
                          i += 2
                  else:
                      i += 1
              return result

          def filter_br_by_url(filename):
              with open(filename) as f:
                  lines = f.readlines()
              result = []
              i = 0
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('#EXTINF'):
                      result.append(line)
                      if i+1 < len(lines):
                          url = lines[i+1].strip()
                          # so aceita se contiver .br ou for https e tiver tvg-country BR
                          has_br = 'tvg-country=\"BR\"' in line
                          is_br_domain = '.br' in url or 'iptv-org.github.io' in url or 'raw.githubusercontent.com' in url
                          if has_br or is_br_domain:
                              result.append(url)
                          i += 2
                          continue
                  i += 1
              return result

          # Noticias - filtro por tvg-country BR
          news_lines = filter_br_by_url('news.m3u')
          sports_lines = filter_br_by_url('sports.m3u')
          br_lines = filter_br_by_url('br.m3u')

          with open('playlist-final.m3u8', 'w') as out:
              out.write('#EXTM3U\n')
              out.write('# Lista IPTV Brasil - PeixotoSilvastm\n\n')
              out.write('# ===== NOTICIAS =====\n')
              for l in news_lines:
                  out.write(l)
              out.write('\n# ===== ESPORTES =====\n')
              for l in sports_lines:
                  out.write(l)
              out.write('\n# ===== TV ABERTA / BRASIL =====\n')
              for l in br_lines:
                  out.write(l)
          "
          wc -l playlist-final.m3u8

      - name: Commit e push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist-final.m3u8
          git diff --staged --quiet || git commit -m "chore: atualiza playlist"
          git push
